steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ctaflow-trainer:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ctaflow-trainer:$SHORT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'

# Push the images to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/ctaflow-trainer:latest'
  - 'gcr.io/$PROJECT_ID/ctaflow-trainer:$SHORT_SHA'

# Build timeout (TA-Lib compilation takes time)
timeout: '1800s'
